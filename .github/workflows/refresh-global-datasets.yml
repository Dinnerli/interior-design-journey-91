name: Refresh global datasets

# Manual only. Re-downloads the Hugging Face datasets in data/global-datasets.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install datasets pandas
      - run: python scripts/build_global_dataset.py
      - run: node scripts/build-combined.mjs
      - run: node scripts/build-excel.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: refresh global datasets"
          git push
