name: Weekly Facebook groups pipeline

# Collects new posts from the Sri Lankan and EPFS Facebook groups in
# data/facebook-groups.json (repository secret BRIGHTDATA_API_KEY) and from the
# X profiles in data/x-profiles.json (repository secret X_BEARER_TOKEN), plus the
# subreddits in data/reddit-sources.json (repository secrets REDDIT_CLIENT_ID and
# REDDIT_CLIENT_SECRET) and the Bluesky searches in data/bluesky-sources.json
# (optional secrets BLUESKY_HANDLE, BLUESKY_APP_PASSWORD). A source whose secret is
# missing is skipped with a warning instead of failing the run.
on:
  schedule:
    - cron: '0 2 * * 1' # every Monday 02:00 UTC (07:30 Sri Lanka time)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: How many days back to collect
        default: '8'
      max_posts_per_group:
        description: Maximum posts per group, profile, subreddit or search
        default: '100'

permissions:
  contents: write

concurrency:
  group: weekly-facebook-groups
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect Facebook group posts
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
          MAX_POSTS_PER_GROUP: ${{ inputs.max_posts_per_group || '100' }}
        run: node scripts/fetch-facebook-groups.mjs
      - name: Collect X posts
        if: always()
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
          MAX_POSTS_PER_PROFILE: ${{ inputs.max_posts_per_group || '100' }}
        run: node scripts/fetch-x-posts.mjs
      - name: Collect Reddit posts
        if: always()
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
          MAX_POSTS_PER_SUBREDDIT: ${{ inputs.max_posts_per_group || '100' }}
        run: node scripts/fetch-reddit-posts.mjs
      - name: Collect Bluesky posts
        if: always()
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '8' }}
          MAX_POSTS_PER_SEARCH: ${{ inputs.max_posts_per_group || '100' }}
        run: node scripts/fetch-bluesky-posts.mjs
      - name: Rebuild combined dataset
        if: always()
        run: node scripts/build-combined.mjs
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: weekly social posts update"
          git push
